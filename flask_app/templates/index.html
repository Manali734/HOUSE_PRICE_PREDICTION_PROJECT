<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        House Price Prediction
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            min-height: 100vh;

            color: white;
        }

        .card {

            border-radius: 20px;

            box-shadow:
            0px 8px 25px rgba(0,0,0,0.4);

            border: none;
        }

        .title {

            font-size: 2.5rem;
            font-weight: bold;
        }

        .subtitle {

            color: gray;
        }

        .btn-custom {

            width: 100%;

            font-size: 18px;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card p-5 bg-light">

                <div class="text-center mb-4">

                    <h1 class="title text-dark">
                        🏡 House Price Prediction
                    </h1>

                    <p class="subtitle">
                        Predict House Price using Machine Learning
                    </p>

                </div>

                <form action="/predict"
                      method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Area (sq.ft)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="area"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Bedrooms
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="bedrooms"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Bathrooms
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="bathrooms"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Stories
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="stories"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Main Road
                            </label>

                            <select
                                class="form-select"
                                name="mainroad">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Guest Room
                            </label>

                            <select
                                class="form-select"
                                name="guestroom">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Basement
                            </label>

                            <select
                                class="form-select"
                                name="basement">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Hot Water Heating
                            </label>

                            <select
                                class="form-select"
                                name="hotwaterheating">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Air Conditioning
                            </label>

                            <select
                                class="form-select"
                                name="airconditioning">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Parking
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="parking"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Preferred Area
                            </label>

                            <select
                                class="form-select"
                                name="prefarea">

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Furnishing Status
                            </label>

                            <select
                                class="form-select"
                                name="furnishingstatus">

                                <option value="furnished">
                                    Furnished
                                </option>

                                <option value="semi-furnished">
                                    Semi-Furnished
                                </option>

                                <option value="unfurnished">
                                    Unfurnished
                                </option>

                            </select>

                        </div>

                    </div>

                    <button
                        class="btn btn-primary btn-lg btn-custom mt-3">

                        Predict House Price

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
